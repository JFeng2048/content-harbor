name: CI

on:
  push:
    branches: [main, refactor-v1]
  pull_request:
    branches: [main, refactor-v1]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 语法检查（compileall）
        run: python -m compileall -q .
      - name: 单元测试（tests/test_*.py）
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: 启动冒烟测试（服务可启动、API 可访问）
        run: |
          set -euo pipefail
          timeout 60 python3 -m server.api &
          sleep 6
          curl -fsS -m 5 http://127.0.0.1:8800/status | head -c 300
